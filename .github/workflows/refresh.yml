name: Refresh data and publish dashboard

on:
  schedule:
    # Daily at 19:00 UTC = 13:00 Mexico City: after Banxico publishes the FIX (~12:00)
    # and after INEGI's 06:00 releases.
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit refreshed data back to the repo
  pages: write      # deploy GitHub Pages
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all series
        # A failed series keeps its previous data and is marked as an error in data/status.json;
        # the step only fails if EVERY series failed.
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          BTS_APP_TOKEN: ${{ secrets.BTS_APP_TOKEN }}
        run: python src/fetch.py

      - name: Run spot checks (informational)
        run: python verify/check.py || echo "::warning::spot check failures - see log"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ verify/refresh_log.txt
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
